# /etc/goodix-touchpad-watchdog/goodix-touchpad-watchdog.conf
#
# Tunables for goodix-touchpad-watchdog. The systemd timer (30s) re-reads this
# file on every run, so no service restart is needed after editing.
#
# Valid values shown are the defaults. Comment out any line to use the default.

# How far back to look in the kernel log for the error pattern.
# Larger = more tolerant of slow bursts, but slower `journalctl` queries.
# WINDOW_SECONDS=1800

# How many errors in a 5-second bucket trigger a rebind.
# Lower = more aggressive (catches the lag faster, but more false positives).
# Higher = only rebinds on severe bursts.
# 10 was chosen to match the observed burst pattern on the XPS 15 9510
# (observed bursts of 18-100 errors in 5s; baseline is 0-1 errors).
# THRESHOLD=10

# Minimum time between rebinds. Prevents rebind-storms if the device
# misbehaves continuously.
# COOLDOWN_SECONDS=300

# The i2c-hid client name to rebind. Find yours with:
#   ls /sys/bus/i2c/drivers/i2c_hid_acpi/
# DEVICE="i2c-DLL0945:00"

# Set to 1 to log what would be done without actually rebinding.
# Useful for tuning THRESHOLD without disrupting the touchpad.
# DRY_RUN=0

# Set to 1 to log on every check (otherwise only on action).
# VERBOSE=0
